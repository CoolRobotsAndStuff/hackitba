<style>
    /* -- Navbar -- */

    /* Functionality */

    .dropdown {
        position: relative;
        display: inline-block;
    }

    .dropdown-container {
        display: inline-block;
        float: right;
    }
    @media (max-width: 140ch) {
    .dropdown-container {
        float: left;
    }
    }

    .links-container { display: inline-block; }

    .dropdown-toggle { display: none; } /* Hide the checkbox */

    .dropdown-toggle:checked       + .dropdown-button::after { content: "\00a0\00a0\00a0 ▴"; }
    .dropdown-toggle:not(:checked) + .dropdown-button::after { content: "\00a0\00a0\00a0 ▾"; }

    .dropdown-content {
        display: none; /* Hide the dropdown content by default */
        position: absolute;
        z-index: 1;
    }

    .dropdown-content a { display: block; }

    /* Show dropdown content when checkbox is checked */
    .dropdown-toggle:checked + .dropdown-button + .dropdown-content { display: block; }

    .nav-link { display: inline-block; }


    /* Hamburger menu */

    @media (max-width: 140ch) {
        .hamburger {
            position: relative;
            display: block;
        }

        .menu-toggle { display: none; }

        .menu-button {
            float: right;
            cursor: pointer;
        }

        .menu-bars {
            display: inline-block;
            position: relative;
        }

        .menu-bar {
            width: 100%;
            position:absolute;
        }

        .menu-content {
            height: 0; /* Hide the menu by default */
            overflow: hidden;
            display: block;
        }

        .menu-toggle:checked + .menu-button + .menu-content {
            overflow: hidden;
            display: block;
        }
        .hamburger a { display: block; }
    }
    @media (min-width: 140ch) {
        .menu-button, .menu-toggle { display: none; }
        .hamburger { display: inline-block; }
    }

</style>

    <div class="navbar">
        <div class="hamburger">
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="menu-button">
                <div class="menu-bars">
                    <div style="top:0;"    class="menu-bar"></div>
                    <div style="top:50%;"  class="menu-bar"></div>
                    <div style="top:100%;" class="menu-bar"></div>
                </div>
            </label>
            <span class="menu-content">
                <a href="/     " class="nav-link">Home</a> 
                <a href="/page1" class="nav-link">Pag1</a>
                <a href="/page2" class="nav-link">Pag2</a>
            </span>
        </div>

        <div class="dropdown-container">

            <div class="dropdown">
                <input type="checkbox" id="theme" class="dropdown-toggle">
                <label for="theme" class="dropdown-button">
                    &nbsp  My Dropdown
                </label>
                <div class="dropdown-content">
                    <a href='#'>
                        Option 1
                    </a>
                    <a href='#'>
                        Option 2 
                    </a>
                </div>
            </div>
        </div>
    </div> <!--Navbar-->
    <div style="clear: both; margin-bottom: 40px"></div>
