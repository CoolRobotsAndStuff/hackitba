<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración — HALeph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      background: #0D0A07;
      color: #F5E6D3;
      padding: 24px;
      font-size: 12px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #E8B87A;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .section {
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(184, 115, 51, 0.6);
      margin-bottom: 10px;
    }

    label {
      display: block;
      color: rgba(245, 230, 211, 0.5);
      margin-bottom: 5px;
      font-size: 11px;
    }

    input {
      width: 100%;
      background: rgba(245, 230, 211, 0.05);
      border: 1px solid rgba(184, 115, 51, 0.15);
      border-radius: 5px;
      color: #F5E6D3;
      font-size: 12px;
      font-family: inherit;
      padding: 7px 9px;
      outline: none;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: rgba(196, 149, 106, 0.5);
    }

    input::placeholder {
      color: rgba(245, 230, 211, 0.2);
    }

    .member-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .member-row input {
      margin-bottom: 0;
    }

    .remove-btn {
      background: rgba(196, 92, 92, 0.1);
      border: 1px solid rgba(196, 92, 92, 0.2);
      border-radius: 5px;
      color: rgba(196, 92, 92, 0.7);
      cursor: pointer;
      padding: 7px 9px;
      font-size: 11px;
      font-family: inherit;
      transition: all 0.15s;
    }

    .remove-btn:hover {
      background: rgba(196, 92, 92, 0.2);
      color: #C45C5C;
    }

    .add-btn {
      background: rgba(245, 230, 211, 0.03);
      border: 1px dashed rgba(184, 115, 51, 0.2);
      border-radius: 5px;
      color: rgba(245, 230, 211, 0.35);
      cursor: pointer;
      padding: 7px;
      font-size: 11px;
      font-family: inherit;
      width: 100%;
      transition: all 0.15s;
      margin-top: 4px;
    }

    .add-btn:hover {
      background: rgba(245, 230, 211, 0.06);
      color: rgba(245, 230, 211, 0.6);
    }

    .members-header {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 6px;
      margin-bottom: 5px;
    }

    .members-header span {
      font-size: 10px;
      color: rgba(184, 115, 51, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #save-btn {
      width: 100%;
      background: linear-gradient(135deg, #B87333 0%, #C4956A 100%);
      border: none;
      border-radius: 6px;
      color: #0D0A07;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 9px;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    #save-btn:hover {
      opacity: 0.9;
    }

    #save-msg {
      text-align: center;
      font-size: 11px;
      color: rgba(122, 184, 122, 0.8);
      margin-top: 10px;
      height: 14px;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <h1>Configuración</h1>

  <div class="section">
    <div class="section-title">Backend</div>
    <label>URL del backend</label>
    <input id="backend-url" type="text" placeholder="https://tu-backend.railway.app" />
  </div>

  <div class="section">
    <div class="section-title">Jira</div>
    <label>Dominio de Jira</label>
    <input id="jira-domain" type="text" placeholder="hackitba-demo.atlassian.net" />
  </div>

  <div class="section">
    <div class="section-title">Equipo</div>
    <div class="members-header">
      <span>Nombre</span>
      <span>Account ID de Atlassian</span>
      <span></span>
    </div>
    <div id="members-list"></div>
    <button class="add-btn" id="add-member">+ Agregar miembro</button>
  </div>

  <button id="save-btn">Guardar configuración</button>
  <div id="save-msg"></div>

  <script>
    const membersList = document.getElementById('members-list')

    function addMemberRow(name = '', accountId = '') {
      const row = document.createElement('div')
      row.className = 'member-row'
      row.innerHTML = `
        <input type="text" placeholder="Pedro" value="${name}" class="member-name" />
        <input type="text" placeholder="712020:abc..." value="${accountId}" class="member-id" />
        <button class="remove-btn">✕</button>
      `
      row.querySelector('.remove-btn').addEventListener('click', () => row.remove())
      membersList.appendChild(row)
    }

    document.getElementById('add-member').addEventListener('click', () => addMemberRow())

    async function loadSettings() {
      const settings = await window.electron.getSettings()
      document.getElementById('backend-url').value = settings.backendUrl || ''
      document.getElementById('jira-domain').value = settings.jiraDomain || ''

      const members = settings.teamMembers || []
      if (members.length === 0) {
        addMemberRow()
      } else {
        members.forEach(m => addMemberRow(m.name, m.accountId))
      }
    }

    document.getElementById('save-btn').addEventListener('click', async () => {
      const members = [...document.querySelectorAll('.member-row')].map(row => ({
        name: row.querySelector('.member-name').value.trim(),
        accountId: row.querySelector('.member-id').value.trim()
      })).filter(m => m.name && m.accountId)

      await window.electron.saveSettings({
        backendUrl: document.getElementById('backend-url').value.trim(),
        jiraDomain: document.getElementById('jira-domain').value.trim(),
        teamMembers: members
      })

      const msg = document.getElementById('save-msg')
      msg.textContent = '✓ Configuración guardada'
      setTimeout(() => { msg.textContent = '' }, 2500)
    })

    loadSettings()
  </script>
</body>
</html>
